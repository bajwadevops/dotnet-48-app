local-windows-execution:
  needs: cloud-linux-orchestration
  runs-on: [self-hosted, Windows, local-net48-runner]

  steps:
  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Setup MSBuild Engine
    uses: microsoft/setup-msbuild@v2

  - name: Setup NuGet Dependencies
    uses: NuGet/setup-nuget@v1

  - name: Restore Project Packages
    shell: cmd
    run: nuget restore YourSolution.sln

  # 1. Compile safely into a local staging directory first
  - name: Compile to Local Staging Directory
    shell: cmd
    run: msbuild YourSolution.sln /p:Configuration=Release /p:OutDir="C:\actions-runner\staging\\" /p:DeployOnBuild=false

  # 2. Deploy using native command tools to overwrite locked paths
  - name: Force Copy to IIS Web Directory
    shell: cmd
    run: |
      xcopy "C:\actions-runner\staging\*.*" "C:\inetpub\wwwroot\your-app\" /Y /E /I
      xcopy "index.aspx" "C:\inetpub\wwwroot\your-app\" /Y
      xcopy "web.config" "C:\inetpub\wwwroot\your-app\" /Y