name: Hybrid Cloud Linux and Local Windows Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cloud-linux-orchestration:
    runs-on: ubuntu-latest
    steps:
    - name: Initialize Pipeline Workflow
      run: |
        echo "Pipeline workflow initialized by cloud-hosted Linux runner."

  local-windows-execution:
    needs: cloud-linux-orchestration
    runs-on: [self-hosted, Windows, local-net48-runner]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild Engine
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet Dependencies
      uses: NuGet/setup-nuget@v1

    - name: Restore Project Packages
      shell: cmd
      run: nuget restore YourSolution.sln

    # Compiles code and copies index.aspx + web.config right into an accessible staging path
    - name: Compile and Publish to Local Directory
      shell: cmd
      run: |
        msbuild YourSolution.sln /p:Configuration=Release /p:OutDir="C:\actions-runner\staging\\" /p:DeployOnBuild=false
        copy "index.aspx" "C:\actions-runner\staging\" /Y
        copy "web.config" "C:\actions-runner\staging\" /Y