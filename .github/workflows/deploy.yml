name: Hybrid Cloud Linux and Local Windows Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cloud-linux-orchestration:
    runs-on: ubuntu-latest
    steps:
    - name: Initialize Pipeline Workflow
      run: |
        echo "Pipeline initialized by cloud-hosted Linux runner."

  local-windows-execution:
    needs: cloud-linux-orchestration
    runs-on: [self-hosted, Windows, local-net48-runner]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild Engine
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet Dependencies
      uses: NuGet/setup-nuget@v1

    - name: Restore Project Packages
      shell: cmd
      run: nuget restore YourSolution.sln

    - name: Compile and Deploy Locally to IIS
      shell: cmd
      run: msbuild YourSolution.sln /p:Configuration=Release /p:DeployOnBuild=true /p:DeployDefaultTarget=WebPublish /p:WebPublishMethod=FileSystem /p:publishUrl="C:\inetpub\wwwroot\your-app"
